[project]
name = "net-dev-cli"
version = "0.1.0"
description = "Check and update PAN-OS and dynamic content on Palo Alto firewalls over the XML API"
authors = [
    {name = "William Freeman"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyinstaller (>=6.22.3,<7.0.0) ; python_version >= \"3.13\" and python_version < \"3.16\""
]
